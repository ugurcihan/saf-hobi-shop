name: Trendyol katalog senkron (manuel)

# NOT: Trendyol'un Cloudflare koruması GitHub Actions'ın veri merkezi IP'lerini
# engelliyor (challenge sayfası döner). Bu yüzden zamanlanmış (cron) çalışma
# KAPALI — günlük senkron yerel makinede launchd ile yapılır
# (scripts/sync-and-push.sh, her gün 06:00). Bu workflow yalnızca elle
# tetiklemek veya ileride bir proxy/scraper-API secret'ı eklenirse diye durur.
#
# Proxy ile bulutta çalıştırmak istersen: repo secret'ı SCRAPER_PROXY ekle
# (http://user:pass@host:port) ve scrape-trendyol.mjs'de proxy desteğini aç.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-products
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y webp
      - name: Kataloğu çek
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: xvfb-run -a node scripts/scrape-trendyol.mjs
      - name: Değişiklik varsa commit'le
        run: |
          if [ -n "$(git status --porcelain products.json assets/products)" ]; then
            git config user.name  "saf-hobi-bot"
            git config user.email "actions@github.com"
            git add products.json assets/products
            git commit -m "chore: Trendyol kataloğu güncellendi ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Katalog güncel, commit yok."
          fi
